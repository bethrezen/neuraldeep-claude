[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuraldeep-claude"
version = "0.1.0"
description = "Portable, direct NeuralDeep gateway and tools for Claude Code"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
neuraldeep-claude = "neuraldeep_claude.cli:main"

[tool.setuptools.packages.find]
include = ["neuraldeep_claude*"]
